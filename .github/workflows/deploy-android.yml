# Builds the signed release APK and distributes it with Firebase App Distribution.
#
# Runs when a release tag is pushed (GitFlow tags have no "v": 1.0.1, 1.1.0, ...) or by hand from the
# Actions tab. Repository secrets it needs (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64        the release keystore (viora-release.jks) encoded in Base64
#   ANDROID_STORE_PASSWORD         keystore password
#   ANDROID_KEY_ALIAS              key alias (viora)
#   ANDROID_KEY_PASSWORD           key password
#   FIREBASE_SERVICE_ACCOUNT_KEY   JSON key of a Google Cloud service account with the
#                                  "Firebase App Distribution Admin" role
#   VIORA_MAPBOX_PUBLIC_TOKEN      public Mapbox token (pk.…) for the map
# And one repository variable: FIREBASE_APP_ID (1:1085458528165:android:956ca686ddeaa2f2b95a4c).
name: Deploy Android

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes shown to the testers
        required: false
        default: ''

concurrency:
  group: deploy-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTER_GROUPS: arcadiadevs-internal
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches versionName
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Run the unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Restore the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/viora-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/viora-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VIORA_MAPBOX_PUBLIC_TOKEN: ${{ secrets.VIORA_MAPBOX_PUBLIC_TOKEN }}
        run: ./gradlew :app:assembleRelease

      - name: Verify the APK signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "certificate (DN|SHA-256 digest)"

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v4
        with:
          name: viora-${{ github.ref_name }}-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Write the release notes
        env:
          MANUAL_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ -n "$MANUAL_NOTES" ]; then
            notes="$MANUAL_NOTES"
          else
            notes="Viora $GITHUB_REF_NAME"$'\n'"$(git log -1 --format=%s)"
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.txt"

      - name: Distribute with Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          npx --yes firebase-tools@latest appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt"

      - name: Remove the keys from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/viora-release.jks" "$RUNNER_TEMP/firebase-key.json"
